# Publishes @sparkdynamic/email-builder on a version tag.
#
# Authentication is npm trusted publishing over OIDC, so there is no NPM_TOKEN
# in this repository. The trusted publisher on npmjs.com is configured against
# this repo *and this workflow's filename* — renaming this file breaks publishing
# until the npm side is updated to match.
#
# This is not CI: the gate is local and runs before every commit (see CLAUDE.md).
# It runs again here only so a red build cannot reach the registry, which is the
# one mistake that is not undoable.
name: publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest # Trusted publishing does not work on self-hosted runners.
    permissions:
      contents: read
      id-token: write # Mints the OIDC token npm authenticates with.

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          # Required, despite writing an .npmrc with an ${NODE_AUTH_TOKEN}
          # placeholder that looks like it would get in the way. It is what
          # points npm at the registry; without it npm finds no registry
          # configuration and fails with ENEEDAUTH before it ever attempts the
          # OIDC exchange. npm's own documented example includes it.
          registry-url: 'https://registry.npmjs.org'
          # npm's docs: never cache in a release build.
          package-manager-cache: false

      # Trusted publishing needs npm >= 11.5.1. Node 24 ships a new enough npm,
      # but pin the floor explicitly rather than depend on the runner image.
      - run: npm install -g npm@latest

      - run: npm ci

      - name: Tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./packages/email-builder/package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "tag v$tag does not match package version $version" >&2
            exit 1
          fi

      # Before the gate, not after: the editor app imports the built package, so
      # `tsc --noEmit` cannot resolve @sparkdynamic/email-builder/editor until
      # dist exists. A working tree that has been built already hides this, which
      # is exactly how it reached CI.
      - run: npm run build --workspace packages/email-builder

      - name: Gate
        run: |
          npx prettier . --check
          npx eslint .
          npx tsc --noEmit
          npm test

      # Logs exactly what the tarball contains, so a bad `files` entry is
      # visible in the run rather than discovered by a consumer.
      - run: npm pack --dry-run
        working-directory: packages/email-builder

      # Trusted publishing fails as an uninformative 404, so record what the
      # handshake had to work with. Cheap, and this workflow runs rarely.
      - name: OIDC diagnostics
        run: |
          echo "npm  $(npm --version)   (trusted publishing needs >= 11.5.1)"
          echo "node $(node --version)"
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "OIDC token endpoint: available"
          else
            echo "OIDC token endpoint: MISSING — check permissions.id-token"
          fi
          echo "registry: $(npm config get registry)"
          echo "--- ~/.npmrc"
          sed 's/_authToken=.*/_authToken=<redacted>/' ~/.npmrc 2>/dev/null || echo "(none)"

      # Plain `npm publish` from the package directory rather than --workspace
      # from the root: the OIDC exchange is what npm documents and tests, and
      # there is no reason to hand it an untested code path on a release.
      #
      # No --provenance flag: trusted publishing attaches provenance itself.
      # Access comes from publishConfig.access in package.json.
      - run: npm publish
        working-directory: packages/email-builder
        env:
          # Verbose so a failed handshake leaves evidence behind.
          NPM_CONFIG_LOGLEVEL: verbose
